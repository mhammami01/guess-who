<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Who Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <section class="msger">
    <header class="msger-header">  
        <div class="msger-header-left">
          <span id="teamName" class="team-bubble">Team: Unknown</span>
        </div>
        <div class="msger-header-title">- Guess Who -
          <span id="Round" class="rounds">Current Round: 0</span>
        </div>
        <div class="msger-header-right">
          <span id="teamScore" class="score-bubble">Score: 0</span>
        </div>
    </header>

    <main class="msger-chat" style="background-image: url('{{ url_for('static', filename='images/background.jpg') }}');" id="chatArea">
    </main>

    <form id="guessers-buttons" class="inputarea-header" style="display: none; background-image: url('{{ url_for('static', filename='images/background.jpg') }}');" >
      <button id="guess" class="option-bubble">Guess</button>
      <button id="hint" class="option-bubble">Hint</button>
    </form> 
    <form class="msger-inputarea">
      <textarea class="msger-input" id="textInput" placeholder="Enter your response..."></textarea>
      <button id ="submit" type="submit" class="msger-send-btn">submit</button>
    </form>
  </section>
  <button id="nextGroupBtn" style="display: none; margin: 10px auto; padding: 10px 20px; font-size: 16px; cursor: pointer; background: rgb(0, 196, 65);">Give the Computer to Group 2</button> 
  <button id="startBonusQuiz" style="display: none; margin: 10px auto; padding: 10px 20px; font-size: 16px; cursor: pointer; background: rgb(0, 196, 65);">Start Bonus Quiz</button>
  
  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
  <script>
    const BOT_IMG = "{{ url_for('static', filename='images/chatbot.svg') }}";
    const PERSON_IMG = "{{ url_for('static', filename='images/students.png') }}";
  </script>
</body>
</html>
