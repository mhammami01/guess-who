<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Who Game</title>
</head>
<body>
    <section class="msger">
        <header class="msger-header">
            <div class="msger-header-title">Guess Who Game - Setup</div>
        </header>

        <main class="msger-chat" style="background-image: url('{{ url_for('static', filename='images/background.jpg') }}');" id="chatArea">
            <div class="msg left-msg">
                <div class="msg-img" style="background-image: url('{{ url_for('static', filename='images/chatbot.svg') }}');"></div>
                <div class="msg-bubble" style="font-size: 18px; max-width: 700px;">
                    <div class="msg-info">
                        <div class="msg-info-name"></div>
                        <div class="msg-info-time"></div>
                    </div>
                    <div class="msg-text">
                        Welcome to the Guess Who! Please set up your game by entering the team names and selecting the number of rounds.
                        <br>
                        <br>
                        <!-- Game Setup Form -->
                        <div class="game-setup">
                            <form id="gameSetupForm">
                                <div class="form-group">
                                    <label for="team1Name">Team 1 Name:</label>
                                    <input type="text" id="team1Name" name="team1Name" placeholder="Enter Team 1 Name" required>
                                </div>
                                <div class="form-group">
                                    <label for="team2Name">Team 2 Name:</label>
                                    <input type="text" id="team2Name" name="team2Name" placeholder="Enter Team 2 Name" required>
                                </div>
                                <div class="form-group">
                                    <label for="rounds">Number of Rounds:</label>
                                    <select id="rounds" name="rounds" required>
                                        <option value="" disabled selected>Select Rounds</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                    </select>
                                </div>
                                <div class="form-group" style="text-align: center;">
                                    <button class="startbutton" type="submit">Start the Game</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </section>

    <script>
        document.getElementById("gameSetupForm").addEventListener("submit", async function (event) {
            event.preventDefault();
    
            // Get form values
            const team1Name = document.getElementById("team1Name").value.trim();
            const team2Name = document.getElementById("team2Name").value.trim();
            const rounds = parseInt(document.getElementById("rounds").value, 10);
    
            if (!team1Name || !team2Name || isNaN(rounds)) {
                alert("Please provide valid team names and select the number of rounds.");
                return;
            }
    
            // Prepare the API payload
            const payload = {
            "is_running": true,
            "max_rounds": rounds,
            "team_a_name": team1Name,
            "team_b_name": team2Name
            }
    
            try {
                // Make the POST request to the /game API
                const response = await fetch('/game', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
    
                if (response.ok) {
                    const data = await response.json();
                    console.log("Game created:", data);
                    window.location.href = `/game?id=${data.game_id}&r=${rounds}`;
                } else {
                    const errorData = await response.json();
                    console.error("Error creating game:", errorData);
                    alert("Failed to create the game. Please try again.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred while starting the game.");
            }
        });
    </script>
    
</body>
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
