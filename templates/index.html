<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess who Game</title>
    
</head>
<body>
    <!--img src="logo.jpg" alt="Guess Who Logo" class="logo" TODO later-->
    <!--We can add more informations later about llms or the game itself -->
    <div class="info">
        <h1>Welcome to Guess Who Game!</h1>
        <p>
            Do you want to interract with LLMs? Our game will offer you this Chance
        <p>
           Have fun!
        </p>
    </div>

    <div class="startbutton">
        <button class="start" onclick="navigateTo('game')">Start the game</button>
    </div>

    <script>
        function navigateTo(page) {
            // Redirect to the selected  page
            window.location.href = page;
        }
    </script>
</body>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        margin: 20px;
        background-color: #f5f5f5;
    }

    h1 {
        color: #3366cc;
        margin-bottom: 10px;
    }

    p {
        margin-bottom: 15px;
        line-height: 1.6;
    }

    .logo {
        max-width: 100%;
        height: auto;
        margin-bottom: 20px;
    }

    .info {
        text-align: justify;
        max-width: 800px;
        margin: 0 auto;
    }

    .startbutton {
        text-align: center;
        margin-top: 20px;
    }

    .start {
        display: inline-block;
        margin: 10px;
        padding: 12px 24px;
        font-size: 18px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        outline: none;
        color: #fff;
        background-color: #4CAF50;
        border: none;
        border-radius: 5px;
        box-shadow: 0 4px #357a38;
        transition: background-color 0.3s ease;
    }

    .start:hover {
        background-color: #45a049;
    }
</style>
</html>
